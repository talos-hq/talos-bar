[package]
name = "talos-searchd"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "talos-bar search daemon: global hotkey, app catalog, go/ links over kernal-api IPC"

[dependencies]
kernal-api = { git = "https://github.com/forge-ci/kernal-api", branch = "talos/integration", features = ["global-hotkey", "app-catalog", "ipc-async"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
tokio = { version = "=1.53.1", features = ["io-util", "macros", "rt", "sync", "time"] }

[dev-dependencies]
tokio = { version = "=1.53.1", features = ["io-util", "macros", "rt", "sync", "time"] }
