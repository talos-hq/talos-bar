[package]
name = "talos-popover"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "talos-bar search popover drawn with kernal-api gfx, a client of talos-searchd over kernal-api IPC"

[dependencies]
kernal-api = { git = "https://github.com/forge-ci/kernal-api", rev = "82241e6f680662542c75d856d951461d99019751", features = ["gfx-egui", "ipc"] }
png = "=0.17.16"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
