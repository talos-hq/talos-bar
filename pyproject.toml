[project]
name = "talos-bar"
version = "0.0.1"
description = "Cross-platform desktop bar (PySide6 + QML) extended with Python glue"
readme = "README.md"
license = "BSD-3-Clause"
requires-python = ">=3.10"
dependencies = [
  "PySide6-Essentials>=6.7",
  # scripts/: calendar_ical.py and tasks_cli.py
  "icalendar>=6",
  "markdown-it-py>=3",
  "tzlocal>=5",
]

[project.scripts]
talos-bar = "talos_bar.__main__:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "basedpyright>=1.20"]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/talos_bar"]

[tool.ruff]
line-length = 110
target-version = "py310"
src = ["src", "tests"]
# Carried over verbatim from ~/dev/nixos, which lints them with its own
# stricter config; keep them byte-identical rather than restyle them here.
# tests/test_ci_gate.py is copied unchanged too; the gate lane checks it.
extend-exclude = ["src/talos_bar/scripts", "tests/scripts", "tests/test_ci_gate.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "ANN"]

[tool.basedpyright]
include = ["src", "tests"]
exclude = ["src/talos_bar/scripts", "tests/scripts", "tests/test_ci_gate.py"]
pythonVersion = "3.10"
typeCheckingMode = "strict"
reportMissingTypeStubs = false
# Strict types only: no Any, written or leaked in through untyped calls.
reportAny = "error"
reportExplicitAny = "error"
